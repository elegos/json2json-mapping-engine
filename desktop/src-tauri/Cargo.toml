[package]
name = "j2jme-desktop"
version = "0.1.0"
edition = "2021"
description = "Desktop tool for the JSON-to-JSON mapping engine"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[target.'cfg(target_os = "linux")'.dependencies]
# the one tauri's window already uses: only to set the program name before it starts
gtk = "0.18"

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
