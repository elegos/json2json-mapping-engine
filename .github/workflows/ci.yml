# Mirror of .forgejo/workflows/ci.yml — Forgejo is the primary CI target for
# this repo; this file keeps GitHub Actions in sync for repos also pushed there.
name: CI

on:
  push:
  pull_request:

jobs:
  track1:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Set up Python 3.14
        run: uv python install 3.14

      - name: Sync dependencies
        run: uv sync --all-extras --dev

      - name: ruff check
        run: uv run ruff check .

      - name: basedpyright
        run: uv run basedpyright

      - name: pytest (offline tests — no runtime dependency)
        run: uv run pytest tests/track1

      # the committed build/compiled (and its manifest.json) must be what the sources give
      - name: mapper check
        run: uv run mapper check

  # Integration tests (`mapper test --integration`, harness in cli/track2.py, PL/SQL part in
  # compiler/backends/plsql/integration.py) start an
  # ephemeral Oracle container (container-registry.oracle.com/database/adb-free);
  # ubuntu-latest runners ship a docker daemon.
  track2:
    name: Integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Set up Python 3.14
        run: uv python install 3.14

      - name: Sync dependencies
        run: uv sync --all-extras --dev

      - name: mapper build
        run: uv run mapper build

      - name: mapper test (integration — Oracle container)
        run: uv run mapper test --integration
