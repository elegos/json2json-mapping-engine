[project]
name = "json2json-mapping-engine"
version = "0.1.0"
description = "Compiled JSON-to-JSON mapping engine — Python DSL subset compiled to native target code (initially PL/SQL)."
requires-python = ">=3.14"
readme = "README.md"
dependencies = [
    "typer>=0.12",
    "tomli>=2.0; python_version < '3.11'",
    "pyyaml>=6.0",
    "jsonschema>=4.21",
    "tomlkit>=0.15.1",
]

[project.scripts]
mapper = "cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cli", "compiler", "transpiler", "runtime"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "basedpyright>=1.18",
    # only the PL/SQL integration tests (`mapper test --integration`) connect to Oracle
    "oracledb>=2.0",
]

[tool.ruff]
line-length = 100
target-version = "py314"
extend-exclude = [
    "generated/stubs",
    "generated/dataclasses",
    "tests/**/fixtures/golden_*",
    "*.map.py",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.basedpyright]
include = ["cli", "compiler", "transpiler", "runtime", "tests"]
exclude = ["**/*.map.py", "**/fixtures/golden_*"]
pythonVersion = "3.14"
typeCheckingMode = "standard"
reportMissingImports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
