name: CI

on:
  push:
  pull_request:

jobs:
  track1:
    name: Offline tests
    runs-on: docker
    container:
      image: python:3.12-slim
    steps:
      # JavaScript actions (actions/checkout) run inside the job container,
      # and python:3.12-slim ships neither node nor git.
      - name: Install node and git
        run: |
          apt-get update
          apt-get install -y --no-install-recommends nodejs git ca-certificates
          rm -rf /var/lib/apt/lists/*

      - uses: actions/checkout@v4

      - name: Install uv
        run: pip install --no-cache-dir uv

      - name: Sync dependencies
        run: uv sync --all-extras --dev

      - name: ruff check
        run: uv run ruff check .

      - name: basedpyright
        run: uv run basedpyright

      - name: pytest (offline tests — no runtime dependency)
        run: uv run pytest tests/track1

  # Integration tests (`mapper test --integration`, harness in cli/track2.py) start an
  # ephemeral Oracle container (container-registry.oracle.com/database/adb-free)
  # and connects to its published port on 127.0.0.1, so the job needs a
  # docker daemon reachable from the job. Runners with the `docker-dind`
  # label provide one.
  track2:
    name: Integration tests
    runs-on: docker-dind
    container:
      image: python:3.12-slim
    steps:
      - name: Install node, git and docker CLI
        run: |
          apt-get update
          apt-get install -y --no-install-recommends nodejs git ca-certificates docker-cli
          rm -rf /var/lib/apt/lists/*

      - uses: actions/checkout@v4

      - name: Install uv
        run: pip install --no-cache-dir uv

      - name: Sync dependencies
        run: uv sync --all-extras --dev

      - name: mapper build
        run: uv run mapper build

      - name: mapper test (integration — Oracle container)
        run: uv run mapper test --integration
