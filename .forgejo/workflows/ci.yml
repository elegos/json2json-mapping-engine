name: CI

on:
  push:
  pull_request:

jobs:
  track1:
    name: Offline tests
    runs-on: docker
    container:
      image: python:3.14-slim
    steps:
      # JavaScript actions (actions/checkout) run inside the job container,
      # and python:3.14-slim ships neither node nor git.
      - name: Install node and git
        run: |
          apt-get update
          apt-get install -y --no-install-recommends nodejs git ca-certificates
          rm -rf /var/lib/apt/lists/*

      - uses: actions/checkout@v4

      - name: Install uv
        run: pip install --no-cache-dir uv

      - name: Sync dependencies
        run: uv sync --all-extras --dev

      - name: ruff check
        run: uv run ruff check .

      - name: basedpyright
        run: uv run basedpyright

      - name: pytest (offline tests — no runtime dependency)
        run: uv run pytest tests/track1

      # the committed build/compiled (and its manifest.json) must be what the sources give
      - name: mapper check
        run: uv run mapper check

  # Integration tests (`mapper test --integration`, harness in cli/track2.py, PL/SQL part in
  # compiler/backends/plsql/integration.py) start an
  # ephemeral Oracle container (container-registry.oracle.com/database/adb-free)
  # and connects to its published port, so the job needs a docker daemon reachable
  # from the job. Runners with the `docker-dind` label create the job container on
  # a dind daemon (tcp://docker-dind:2375) but pass no DOCKER_HOST to it, and the
  # job sits on that daemon's bridge, where the name `docker-dind` does not
  # resolve; the daemon is at the bridge's default gateway.
  track2:
    name: Integration tests
    runs-on: docker-dind
    container:
      image: python:3.14-slim
    steps:
      - name: Install node, git and docker CLI
        run: |
          apt-get update
          apt-get install -y --no-install-recommends nodejs git ca-certificates docker-cli
          rm -rf /var/lib/apt/lists/*

      - uses: actions/checkout@v4

      - name: Install uv
        run: pip install --no-cache-dir uv

      - name: Sync dependencies
        run: uv sync --all-extras --dev

      - name: Locate the Docker daemon (dind, at the bridge gateway)
        run: |
          gw=$(python -c "import socket, struct; print(next(socket.inet_ntoa(struct.pack('<L', int(f[2], 16))) for f in (l.split() for l in open('/proc/net/route').readlines()[1:]) if f[1] == '00000000'))")
          echo "DOCKER_HOST=tcp://$gw:2375" >> "$GITHUB_ENV"
          echo "docker daemon: tcp://$gw:2375"

      - name: mapper build
        run: uv run mapper build

      - name: mapper test (integration — Oracle container)
        run: uv run mapper test --integration
