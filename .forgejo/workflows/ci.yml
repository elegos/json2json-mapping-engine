name: CI

on:
  push:
  pull_request:

jobs:
  track1:
    runs-on: docker
    container:
      image: python:3.12-slim
    steps:
      # JavaScript actions (actions/checkout) run inside the job container,
      # and python:3.12-slim ships neither node nor git.
      - name: Install node and git
        run: |
          apt-get update
          apt-get install -y --no-install-recommends nodejs git ca-certificates
          rm -rf /var/lib/apt/lists/*

      - uses: actions/checkout@v4

      - name: Install uv
        run: pip install --no-cache-dir uv

      - name: Sync dependencies
        run: uv sync --all-extras --dev

      - name: ruff check
        run: uv run ruff check .

      - name: basedpyright
        run: uv run basedpyright

      - name: pytest (track 1 — no runtime dependency)
        run: uv run pytest tests/track1

  # Track 2 (`mapper test --track 2`, harness in cli/track2.py) is not
  # wired into CI yet — it needs a runner with docker-in-docker access to
  # pull
  # container-registry.oracle.com/database/adb-free.
