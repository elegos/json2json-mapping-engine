name: Release

# The desktop packages (docs/ARCHITECTURE.md, §Packaging): an AppImage, a Windows installer (NSIS)
# and portable zip, and a macOS dmg, all built from Linux in the packaging image.
#
# A tag `vX.Y.Z` (or `vX.Y.Z-suffix`, a pre-release) builds them and makes a DRAFT release:
#  - the version of the tag replaces the one in desktop/src-tauri/Cargo.toml for this build;
#  - a suffix (v1.2.3-beta1) marks the release as a pre-release;
#  - the description is the section of that version in CHANGELOG.md (Keep a Changelog), else its
#    `Unreleased` section, else none (packaging/release.py).
# A manual run only builds the packages (artifacts), with the version of Cargo.toml.
#
# One job per target (they run at the same time when the runner has the slots), then the release.
#
# Secrets for the macOS package (without MACOS_SDK_URL it is left out):
#   MACOS_SDK_URL, MACOS_SDK_TOKEN   where the CI downloads the MacOSX*.sdk.tar.xz from (token optional)
#   MACOS_CERT_P12_BASE64, MACOS_CERT_PASSWORD   the signing certificate (else an ad-hoc signature)

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  packages:
    name: Package ${{ matrix.target }}
    runs-on: docker-dind
    container:
      image: python:3.14-slim
    strategy:
      fail-fast: false
      matrix:
        target: [linux, windows, macos]
    env:
      MACOS_SDK_URL: ${{ secrets.MACOS_SDK_URL }}
      MACOS_SDK_TOKEN: ${{ secrets.MACOS_SDK_TOKEN }}
      MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
      MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
    steps:
      - name: Install node, git, curl and docker CLI (with buildx, the legacy builder is deprecated)
        run: |
          apt-get update
          apt-get install -y --no-install-recommends nodejs git curl ca-certificates docker-cli docker-buildx
          rm -rf /var/lib/apt/lists/*

      - uses: actions/checkout@v4

      # a tag that is not vMAJOR.MINOR.PATCH[-suffix] fails here
      - name: Version and release notes from the tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: python packaging/release.py prepare "$GITHUB_REF_NAME" --notes "$RUNNER_TEMP/notes.md" >> "$GITHUB_ENV"

      - name: Locate the Docker daemon (dind, at the bridge gateway)
        run: |
          gw=$(python -c "import socket, struct; print(next(socket.inet_ntoa(struct.pack('<L', int(f[2], 16))) for f in (l.split() for l in open('/proc/net/route').readlines()[1:]) if f[1] == '00000000'))")
          echo "DOCKER_HOST=tcp://$gw:2375" >> "$GITHUB_ENV"

      - name: Fetch the macOS SDK
        if: matrix.target == 'macos'
        run: |
          if [ -n "$MACOS_SDK_URL" ]; then
            auth=(); [ -z "$MACOS_SDK_TOKEN" ] || auth=(-H "Authorization: token $MACOS_SDK_TOKEN")
            curl -fsSL "${auth[@]}" -o "$RUNNER_TEMP/macos-sdk.tar.xz" "$MACOS_SDK_URL"
            echo "J2JME_MACOS_SDK=$RUNNER_TEMP/macos-sdk.tar.xz" >> "$GITHUB_ENV"
            echo "macOS SDK downloaded ($(du -h "$RUNNER_TEMP/macos-sdk.tar.xz" | cut -f1), sha256 $(sha256sum "$RUNNER_TEMP/macos-sdk.tar.xz" | cut -c1-16)…): the macOS package is built"
          else
            echo "no MACOS_SDK_URL: no macOS package"
            echo "J2JME_SKIP=1" >> "$GITHUB_ENV"
          fi

      - name: Build the package
        if: env.J2JME_SKIP != '1'
        run: J2JME_PKG_COPY=1 dev_scripts/package.sh ${{ matrix.target }}

      # v3: Forgejo does not serve the v4 artifact protocol
      - uses: actions/upload-artifact@v3
        if: env.J2JME_SKIP != '1'
        with:
          name: packages-${{ matrix.target }}
          path: dist/packages/*

  release:
    name: Draft the release
    needs: packages
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: docker-dind
    container:
      image: python:3.14-slim
    steps:
      - name: Install node, git and curl
        run: |
          apt-get update
          apt-get install -y --no-install-recommends nodejs git curl ca-certificates
          rm -rf /var/lib/apt/lists/*

      - uses: actions/checkout@v4

      - name: Version and release notes from the tag
        run: python packaging/release.py prepare "$GITHUB_REF_NAME" --notes "$RUNNER_TEMP/notes.md" >> "$GITHUB_ENV"

      # without a name, every artifact of the run, each in a folder of its name
      - uses: actions/download-artifact@v3
        with:
          path: artifacts

      - name: Draft the release
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p dist/packages
          cp artifacts/*/* dist/packages/
          api="${GITHUB_SERVER_URL}/api/v1/repos/${GITHUB_REPOSITORY}"
          id=$(python -c 'import json, os; print(json.dumps({
                  "tag_name": os.environ["GITHUB_REF_NAME"], "name": os.environ["GITHUB_REF_NAME"],
                  "body": open(os.environ["RUNNER_TEMP"] + "/notes.md").read(),
                  "draft": True, "prerelease": os.environ["J2JME_PRERELEASE"] == "true"}))' \
               | curl -fsS -X POST "$api/releases" -H "Authorization: token $TOKEN" \
                   -H 'Content-Type: application/json' -d @- \
               | python -c 'import json, sys; print(json.load(sys.stdin)["id"])')
          for f in dist/packages/*; do
            curl -fsS -X POST "$api/releases/$id/assets?name=$(basename "$f")" \
              -H "Authorization: token $TOKEN" -F "attachment=@$f" >/dev/null
            echo "uploaded $(basename "$f")"
          done
          echo "draft release $GITHUB_REF_NAME (pre-release: $J2JME_PRERELEASE)"
